<!doctype html>
<html lang="ja">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap５.3.0 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <title>Index</title>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDarkDropdown" aria-controls="navbarNavDarkDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDarkDropdown">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <button class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        Dropdown
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- 入力フィールドのコンテナ -->
<div id="form-container">
    <div class="input-group mb-3">
        <input type="text" class="form-control" name="items[]" placeholder="項目を追加">
        <button class="btn btn-outline-danger remove-form" type="button">-</button>
    </div>
</div>

<!-- 追加ボタン -->
<button class="btn btn-primary" id="add-form" type="button">+ 追加</button>



<form action="#" id="form">
    <input type="submit" value="検索" id="input">
</form>


<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 追加機能
        document.getElementById('add-form').addEventListener('click', function() {
            const container = document.getElementById('form-container');
            const newForm = container.querySelector('.input-group').cloneNode(true);
            newForm.querySelector('input').value = ''; // 値をクリア
            container.appendChild(newForm);
        });

        // 削除機能（イベントデリゲーション）
        document.addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('remove-form')) {
                if (document.querySelectorAll('.input-group').length > 1) {
                    e.target.closest('.input-group').remove();
                }
            }
        });
    });


    document.getElementById('form').onsubmit = function() {
        console.log('クリックされました');
    }


</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
