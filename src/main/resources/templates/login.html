<!doctype html>
<html lang="ja">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap５.3.0 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <title>Login</title>
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-dark bg-dark px-3 sticky-top">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav4" aria-controls="navbarNav4" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <a class="navbar-brand" href="">Sample</a>
</nav>

<div
        class="border bg-light rounded mx-auto my-5 py-4 px-4"
        style="width : 350px">
    <h3>Login</h3>

    <form method="post" th:action="@{/login}">
        <div class="row form-group">
            <label>id</label>
            <input type="text" name="userid" class="form-control" required>
            <label>password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="row my-3">
            <button type="submit" class="col-5 btn btn-outline-primary btn-block offset-7">login</button>
        </div>
        <div class="row" th:if="${param.error}">
            <div class="alert alert-danger">
                <span th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message ?: 'ユーザー情報が存在しません'}"></span>
            </div>
        </div>
    </form>

</div>
</body>
</html>
