<!doctype html>
<html lang="ja">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap５.3.0 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

  <title>Index</title>
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-dark bg-dark px-3 sticky-top">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav4" aria-controls="navbarNav4" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <a class="navbar-brand" th:href="@{/index}">Sample</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link active" href="#">menu1</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">menu2</a>
      </li>
    </ul>
    <ul class="navbar-nav">
      <li class="nav-item">
        <form th:action="@{/logout}" name="logout" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <a href="#" class="nav-link" onclick="document.logout.submit();">logout</a>
        </form>
      </li>
    </ul>
  </div>
</nav>

<div
        class="border bg-light rounded mx-auto my-5 py-4 px-4"
        style="width : 350px">
  <h3>Index</h3>
  <p th:text="'Welcome!' + ${username}"></p>
  <div class="row">
    <a class="col-5 btn btn-outline-primary btn-block my-3 me-auto" th:href="@{/toRegister}">Register</a>
    <a class="col-5 btn btn-outline-primary btn-block my-3" th:href="@{/toUpdate}">Update</a>
  </div>
  <div class="row">
    <a class="col-5 btn btn-outline-primary btn-block my-3 me-auto" th:href="@{/toDelete}">Delete</a>
    <a class="col-5 btn btn-outline-primary btn-block my-3" th:href="@{/toSearch}">Search</a>
  </div>
  <div class="row">
    <a class="col-5 btn btn-outline-primary btn-block my-3 me-auto" th:href="@{/toResetPassword}">Reset Password</a>
  </div>
</div>
</body>
</html>
